# Bargain Hunter — tunable parameters. Edit and push; no code change needed.

run:
  dry_run: false
  max_alerts_per_user_per_day: 10
  max_digital_alerts_per_day: 10    # default digital-track daily cap (Notion has no matching property)
  timezone: "Australia/Sydney"      # AET/AEDT — used for daily caps, quiet hours, and midnight boundary
  # Quiet hours OFF (2026-08-22, owner's call): overnight is when a lot of the
  # good stuff lands — free-credit windows, flash 神价, invite codes that run
  # out — and holding those until 7am is often holding them until they're gone.
  # Set both to "HH:MM" to re-enable; is_in_quiet_hours() treats either being
  # unset as disabled, and the drain branch then runs every cycle, so nothing
  # can be stranded in the queue by this change.
  #
  # NOTE: a subscriber's own quiet_hours_start/end in Notion OVERRIDE this
  # global setting (see quiet_hours.py) — turning it off here does not clear a
  # per-subscriber window.
  quiet_hours_start: null
  quiet_hours_end: null
  quiet_hours_queue_max_age_hours: 12  # overnight-queued notifications older than this are dropped at drain

sources:
  ozbargain:
    enabled: true
    feed_url: "https://www.ozbargain.com.au/deals/feed"
  camelcamelcamel:
    enabled: true
    feed_url: "https://au.camelcamelcamel.com/top_drops/feed"

  # --- Global digital deals. All voteless (see scoring.hot.voteless_sources)
  # and reach subscribers via watch keywords (scoring.watch.trusted_sources).
  dealnews:
    enabled: true
    poll_interval_minutes: 60
    currency: "USD"
    feed_urls:
      - "https://www.dealnews.com/c124/Computers/Software/?rss=1"
    region_allow_patterns: ["global", "worldwide", "any region",
                            "international card", "全球可用", "支持国际信用卡"]
    region_block_patterns:
      - "US only"
      - "USA only"
      - "U\\.S\\. residents"
      - "US/CA residents"
      - "United States and Canada only"
      - "requires US billing"
      - "US billing (address|zip)"
      - "not available outside the US"
      - "US App Store"
      - "\\.edu email"
      - "(T-Mobile|Verizon|AT&T|Xfinity|Spectrum) customers"
      - "US (PayPal|Venmo)"
      - "region-locked"
      - "EU key"
      - "ROW excluded"
  slickdeals:
    enabled: true
    poll_interval_minutes: 60
    currency: "USD"
    # The query string IS the filter. Keep terms specific; bare "grok" collides
    # with "Grokking Simplicity" and "Grokit VR".
    feed_urls:
      - "https://slickdeals.net/newsearch.php?rss=1&q=supergrok&searcharea=deals&searchin=first"
      - "https://slickdeals.net/newsearch.php?rss=1&q=chatgpt&searcharea=deals&searchin=first"
      - "https://slickdeals.net/newsearch.php?rss=1&q=claude+ai&searcharea=deals&searchin=first"
      - "https://slickdeals.net/newsearch.php?rss=1&q=perplexity&searcharea=deals&searchin=first"
      - "https://slickdeals.net/newsearch.php?rss=1&q=vpn&searcharea=deals&searchin=first"
      - "https://slickdeals.net/newsearch.php?rss=1&q=cloud+storage&searcharea=deals&searchin=first"
    region_allow_patterns: ["global", "worldwide", "any region",
                            "international card", "全球可用", "支持国际信用卡"]
    region_block_patterns:
      - "US only"
      - "USA only"
      - "U\\.S\\. residents"
      - "US/CA residents"
      - "United States and Canada only"
      - "requires US billing"
      - "US billing (address|zip)"
      - "not available outside the US"
      - "US App Store"
      - "\\.edu email"
      - "(T-Mobile|Verizon|AT&T|Xfinity|Spectrum) customers"
      - "US (PayPal|Venmo)"
      - "region-locked"
      - "EU key"
      - "ROW excluded"
  v2ex:
    enabled: true
    # was 180: index.xml/openai.xml are real firehoses (fresh items within the
    # hour), tightened to give them a chance inside the 36h watch window.
    poll_interval_minutes: 60
    currency: "CNY"
    feed_urls:
      - "https://www.v2ex.com/feed/deals.xml"  # 优惠信息 node: purpose-built,
                                                 # low volume (~0.7/day)
      - "https://www.v2ex.com/index.xml"        # 全站最新: firehose, kept
                                                 # on-topic by title_keywords
                                                 # (code default, see
                                                 # feed_deals.py)
      - "https://www.v2ex.com/feed/openai.xml"  # OpenAI node: same reason
    # region_block/allow_patterns removed: the owner has WeChat, Alipay and a
    # mainland phone number, so 仅支持支付宝/仅支持微信/中国大陆手机号/实名认证
    # etc. are all satisfiable for him, not a reason to drop a deal — keeping
    # them would eventually misfire on real, actionable 羊毛. The allow list
    # only existed to override the block list, so it goes with it. (The US-
    # residency blocks on dealnews/slickdeals are unrelated and stay — those
    # are genuinely unactionable for him.)
  openrouter:
    enabled: true
    poll_interval_minutes: 1440
    min_drop_percent: 10.0
    model_allowlist: []          # e.g. ["x-ai/", "anthropic/", "deepseek/"]

  # --- AU finance: CDR product reference data ---
  bank_rates:
    enabled: true
    poll_interval_minutes: 1440        # daily; rates do not move hourly
    currency: "AUD"
    min_rate_rise_bps: 10              # alert when a deposit rate rises >= 10bp
    min_bonus_points_rise: 10000       # alert when card signup points rise
    max_detail_fetches_per_run: 40   # bound the cold-start burst: a full 197-product
                                     # seed spreads over ~5 runs instead of blowing
                                     # past the 5-minute hunt.yml cadence
    brands:                            # publicBaseUri verified 2026-08-20
      - {name: "ING",       base: "https://id.ob.ing.com.au",              x_v: 4}
      - {name: "UBank",     base: "https://public.cdr-api.86400.com.au",   x_v: 4}
      - {name: "Macquarie", base: "https://api.macquariebank.io",          x_v: 4}
      - {name: "Up",        base: "https://api.up.com.au",                 x_v: 4}
      - {name: "CommBank",  base: "https://api.commbank.com.au/public",    x_v: 4}
      - {name: "Westpac",   base: "https://digital-api.westpac.com.au",    x_v: 4}
      - {name: "NAB",       base: "https://openbank.api.nab.com.au",       x_v: 4}
      - {name: "ANZ",       base: "https://api.anz",                       x_v: 4}
      - {name: "Bendigo",   base: "https://api.cdr.bendigobank.com.au",    x_v: 4}
      - {name: "BOQ",       base: "https://api.cds.boq.com.au",            x_v: 5}
    product_categories:
      - "TRANS_AND_SAVINGS_ACCOUNTS"
      - "TERM_DEPOSITS"
      - "CRED_AND_CHRG_CARDS"

  # --- Travel: AU-departure airfare deals ---
  iknowthepilot:
    enabled: true
    poll_interval_minutes: 120
    currency: "AUD"
    feed_urls: ["https://www.iknowthepilot.com.au/feed/"]

  # --- Sources gated by what the owner can actually transact, not by country.
  # See docs/GLOBAL_EXPANSION_PLAN.md: the developed-country consumer and
  # welfare categories were probed and scored a total wipeout (26 candidates,
  # 0 kept) — foreign welfare needs a national ID and foreign retail needs a
  # local address. That finding stands. Read the ⚠️ Correction in that doc
  # before extending this logic to anywhere the owner holds citizenship: it was
  # wrongly applied to mainland China once already, on an owner model nobody
  # had verified.

  # Vercel's changelog. Measured live 2026-08-21: 3.3 MB Atom, 1492 entries back
  # to 2016, newest 10.6h. 125 entries fall inside 30 days and 9 of those are
  # real time-boxed offers (AI Gateway model discounts, free windows, free
  # domain for Pro) — account-level and card-billed, claimable from AU the same
  # day. max_item_age_hours + title_keywords live in feed_deals.py's per-name
  # defaults; without the age cutoff every poll would flood on 10 years of
  # entries. Polled 12-hourly: these offers run days to weeks, not hours.
  vercel:
    enabled: true
    poll_interval_minutes: 720
    currency: "USD"
    feed_urls: ["https://vercel.com/atom"]

  # AppSumo lifetime SaaS/dev-tooling licences. Digitally delivered, USD,
  # chargeable to an AU card, no residency gate. The API ignores every query
  # parameter except `page` (verified by slug-list comparison — a byte compare
  # is invalid here, `dates.schema_end_date` is derived from request time), so
  # the source filters client-side and pages sequentially.
  appsumo:
    enabled: true
    poll_interval_minutes: 360
    currency: "USD"
    max_pages: 4

  # AU frequent-flyer. Both feeds share one `name` (one name = one filter, see
  # the v2ex note above). The deals subforum is low-volume (~0.7 threads/week)
  # but 17/20 sampled threads carry a concrete ex-AU fare with a price; the blog
  # adds ~1 "Airfare of the Week" plus Velocity/KrisFlyer/Qantas program news.
  # Deliberately NO title_keywords on aff/pointhacks: at this volume a filter is
  # the failure mode, not the fix — the publisher changes its title convention,
  # the filter matches zero forever, and the feed stays a healthy 200.
  aff:
    enabled: true
    poll_interval_minutes: 180
    currency: "AUD"
    feed_urls:
      - "https://www.australianfrequentflyer.com.au/community/forums/cheap-flights-travel-deals.222/index.rss"
      - "https://www.australianfrequentflyer.com.au/feed/"

  # Point Hacks: 100% AU-native. Deal density is the weakness (~1 in 10 items is
  # a live offer, mostly the recurring gift-card-offer post), but that slice is
  # recurring AUD off spend the owner already makes.
  pointhacks:
    enabled: true
    poll_interval_minutes: 180
    currency: "AUD"
    feed_urls: ["https://www.pointhacks.com.au/feed/"]

  # 什么值得买 — mainland China's main deal aggregator, and the biggest gap in
  # this pipeline until now. The web frontend sits behind a JS challenge, but
  # the app API does not: no auth, no key, no CAPTCHA, just the app UA (a
  # browser UA gets HTTP 202 + a JS probe stub instead of JSON). Verified live
  # 2026-08-21. Two endpoints — /v1/home/list (好价, filtered to the 优惠
  # channel) and /v1/youhui/list (券/服务) — offset-paginated, de-duped.
  #
  # In voteless_sources despite carrying a real 值 count (article_worthy): its
  # scale (0-15 on fresh items) is not commensurable with OzBargain's, and
  # compute_site_velocity_index is a percentile over all non-voteless deals, so
  # mixing them would corrupt a baseline that has been calibrating for weeks.
  # votes_pos is still populated — it shows on the board, it just doesn't feed
  # the AU baseline.
  smzdm:
    # DISABLED 2026-08-21, same day it shipped. It works — 72-92 deals/poll,
    # three endpoints, real 值 counts — but it surfaces the wrong thing. Live
    # sample of 41 items: 京东 31, 拼多多 5, 天猫 4, and the content is 月饼,
    # 薯片, 牛角面包, a ¥4.99 packet of biscuits. Measured digital/remotely-
    # redeemable share: 3/41 hits on a generous keyword probe, and all three
    # were false positives (88VIP 沐浴露 matched "VIP", a tablet and a keyboard
    # both matched "游戏"). True share ≈ 0%.
    #
    # The lesson, recorded so this isn't relitigated: "can he capture it" and
    # "is it worth capturing" are two different axes, and this pass conflated
    # them. The owner has a mainland address and family there, so these ARE
    # deliverable — they are simply groceries. A ¥5 biscuit alert is not 羊毛.
    # 什么值得买 is built for domestic Chinese shoppers; there is no digital
    # slice inside it to filter down to.
    #
    # Flip to true if the goal ever becomes deliberate CN household shopping.
    # The source, its three endpoints and its tests all still work.
    enabled: false
    poll_interval_minutes: 60
    max_pages: 2
    max_item_age_hours: 72
    request_delay_seconds: 1.0

  # Free LLM API tiers. Diffs mnfst/awesome-free-llm-apis' data.json (★6876,
  # pushed daily, commits are substantive — "remove the three deprecated NVIDIA
  # rows", not bot boilerplate). Measured 2026-08-21: 16 providers, ~112-118
  # free models, each with context + rateLimit ("30 RPM, 1,000 RPD").
  #
  # The static list is discovery value, not capture value — a standing free tier
  # has no expiry and no urgency. The *diff* is the point: "Groq raised this
  # model to 60 RPM" or "NVIDIA NIM added a free model" is an actionable event.
  # That distinction is why free-for-dev was rejected and this was not.
  free_llm:
    enabled: true
    poll_interval_minutes: 1440   # upstream pushes at most once/day

  # --- CN AI token 羊毛: DeepSeek/Kimi/Zhipu/SiliconFlow pricing & policy docs.
  # /v1/models is 401 without a key on all of these, and the CN deal
  # aggregators are anti-bot walled -- these are the platforms' own published
  # docs (Mintlify llms.txt convention, or DeepSeek's statically-rendered
  # Docusaurus site), fetched and diffed the same way as llm_prices.py.
  cn_llm_docs:
    enabled: true
    # Docs move monthly, not hourly -- weekly is the compromise: catches a
    # time-limited promo (e.g. Kimi's file-API "限时免费" window) without
    # hammering static doc pages daily.
    poll_interval_minutes: 10080     # 7 days
    currency: "CNY"
    pages:                            # verified live 2026-08-21 (llms.txt convention
                                       # / static HTML); owner has WeChat + Alipay +
                                       # a mainland phone number, so mainland-only
                                       # promos on these are fully actionable for him
      - {tag: kimi, slug: chat, label: "Kimi 定价说明",
         url: "https://platform.kimi.com/docs/pricing/chat.md"}
      - {tag: kimi, slug: chat-k3, label: "Kimi K3",
         url: "https://platform.kimi.com/docs/pricing/chat-k3.md"}
      - {tag: kimi, slug: chat-k27-code, label: "Kimi K2.7 Code",
         url: "https://platform.kimi.com/docs/pricing/chat-k27-code.md"}
      - {tag: kimi, slug: chat-k26, label: "Kimi K2.6",
         url: "https://platform.kimi.com/docs/pricing/chat-k26.md"}
      - {tag: kimi, slug: chat-k25, label: "Kimi K2.5",
         url: "https://platform.kimi.com/docs/pricing/chat-k25.md"}
      - {tag: kimi, slug: chat-v1, label: "Moonshot V1",
         url: "https://platform.kimi.com/docs/pricing/chat-v1.md"}
      - {tag: kimi, slug: limits, label: "Kimi 充值等级",
         url: "https://platform.kimi.com/docs/pricing/limits.md"}
      - {tag: deepseek, slug: pricing, label: "DeepSeek 定价",
         url: "https://api-docs.deepseek.com/quick_start/pricing/"}
      - {tag: deepseek, slug: updates, label: "DeepSeek Change Log",
         url: "https://api-docs.deepseek.com/updates/"}
      - {tag: zhipu, slug: model-overview, label: "智谱 模型概览",
         url: "https://docs.bigmodel.cn/cn/guide/start/model-overview.md"}
      - {tag: siliconflow, slug: rate-limits, label: "SiliconFlow Rate Limits",
         url: "https://docs.siliconflow.cn/cn/userguide/rate-limits/rate-limit-and-upgradation.md"}
      # 阿里云百炼 (Alibaba Model Studio) — the largest CN LLM platform that was
      # missing here. Both verified live 2026-08-21: HTTP 200, text/markdown,
      # zero redirects (19,202 B and 8,473 B respectively). new-free-quota is
      # the new-account free allowance per model; coding-plan is a fixed-CNY
      # monthly bundle of Qwen/GLM/Kimi/MiniMax, payable via Alipay/WeChat.
      - {tag: aliyun, slug: new-free-quota, label: "百炼 新人免费额度",
         url: "https://help.aliyun.com/zh/model-studio/new-free-quota.md"}
      - {tag: aliyun, slug: coding-plan, label: "百炼 Coding Plan",
         url: "https://help.aliyun.com/zh/model-studio/coding-plan.md"}

scoring:
  window_minutes: 15               # 15-min window: accurate current momentum, 2-run detection
  hot:
    # V1 gate: 5 votes in 15 min = 20 votes/h — same velocity bar, shorter window
    min_votes_gain_per_window: 5   # net votes gained in window (V1)
    early_burst_age_hours: 2       # age threshold for early-burst detection (H)
    # V2=30: p90 of votes_pos in observed data is 44; 30 targets top ~25%
    early_burst_min_votes: 30      # early-burst absolute vote count (V2)
    velocity_top_percent: 10       # top P% of active deals enter candidate pool
    # threshold=1.5: calibrated on 143 observed deals → ~7% fire rate (10/143)
    hot_threshold: 1.5             # weighted heat score threshold
    neg_vote_penalty_weight: 0.5   # negative-vote penalty weight
    age_penalty_half_life_hours: 12  # age decay half-life
    min_votes_for_percentile: 10   # deals below this vote count skip the percentile gate
    # Data finding: deals with <10 votes but high comment velocity scored 12.4 (false positives).
    # Floor gates out these noise cases before scoring.
    min_votes_to_candidate: 10     # minimum votes to enter hot candidate pool (data-calibrated)
    # Data finding: comment velocity at 0.25 weight dominated scores (e.g. 10+ pts from comments alone).
    # 0.1 still rewards comment engagement without letting it override vote signal.
    comment_velocity_weight: 0.1   # comment velocity weight in scoring formula (reduced to reduce noise)
    # Quality gate (data-backed, 2026-06-24/25 observations):
    # Deals with votes < quality_high_votes_threshold MUST have discount >= quality_min_discount_pct.
    # Eliminates promo/food/membership deals (22-38 votes, no extractable discount)
    # while keeping genuine product discounts (e.g. 13 votes, 50% off).
    quality_min_discount_pct: 20.0  # deals below threshold need ≥20% discount
    quality_high_votes_threshold: 40  # deals with ≥40 votes skip the discount requirement
    # Sources with no vote signal at all — kept out of the OzBargain-calibrated
    # site velocity index (see the `watch.trusted_sources` counterpart below).
    voteless_sources: ["camelcamelcamel", "dealnews", "slickdeals", "v2ex",
                        "openrouter", "bank_rates", "iknowthepilot", "cn_llm_docs",
                        "vercel", "appsumo", "aff", "pointhacks",
                        "smzdm", "free_llm"]
    # Age cap (hours since posted_at) for the voteless discount-only candidacy
    # path — the only staleness gate on it, since there's no vote velocity to
    # decay a score. Without this, an old high-discount item from a global
    # feed (measured live: slickdeals/v2ex/dealnews return months-to-years-old
    # reposts) can classify `top`, which reaches every hot subscriber
    # regardless of category (universal_top below).
    max_voteless_age_hours: 48
    # Hot ladder (calibrated on ObservationLog: among distinct hot deals ~57%
    # reach 4.0 and ~36% reach 7.0). A deal earns the highest tier it qualifies
    # for; below `good` (= the old hot_threshold) it is not hot. `top` adds a
    # value gate (min_votes) so it captures genuinely strong deals, not just velocity.
    universal_top: true              # top tier reaches every hot subscriber, bypassing category filter
    tiers:
      - {name: top,   min_score: 7.0, min_votes: 40}
      - {name: great, min_score: 4.0}
      - {name: good,  min_score: 1.5}   # = the original hot floor
    # Event-day adaptive baseline: normalizes the absolute vote-velocity gates
    # above against a rolling per-hour site heat index so genuinely good deals
    # on high-traffic days (Boxing Day, Prime Day) aren't misclassified. The
    # warmup period means behaviour is unchanged for the first few days while
    # the baseline accumulates real data.
    adaptive:
      enabled: true
      ewma_half_life_days: 14
      index_percentile: 75
      min_deals_for_index: 5
      warmup_days: 3
      ratio_clamp_min: 0.5
      ratio_clamp_max: 3.0
      baseline_sample_clamp: 3.0
      min_baseline_velocity: 0.1
  watch:
    min_votes: 15                  # minimum positive votes after keyword match (raised to 15)
    min_discount_percent: 15       # discount threshold when no votes available (e.g. CCC) — raised to 15%
    max_deal_age_hours: 36         # skip deals older than 36h to avoid backlog filling daily cap
    # Editorially curated / keyword-scoped feeds carry neither votes nor a
    # parseable discount; the keyword match is itself the quality guard.
    trusted_sources: ["dealnews", "slickdeals", "v2ex", "openrouter",
                       "bank_rates", "iknowthepilot", "cn_llm_docs",
                       "vercel", "appsumo", "aff", "pointhacks",
                        "smzdm", "free_llm"]

dedup:
  lookback_days: 7                 # read recent Sent Log window for local dedup
  max_realerts_per_deal: 1         # allow one re-alert per (deal, subscriber): newly-satisfied watch ceiling or a significant price drop
  significant_price_drop_percent: 5.0
  heat_band_size_votes: 50

cold_start:
  ignore_deals_older_than_hours: 6  # on first sight, skip deals older than this

alerting:
  min_consecutive_failures: 3      # send maintainer alert only after this many consecutive failures
  cooldown_hours: 1.0              # silence period after an alert fires

# ---------------------------------------------------------------------------
# Cashback stacking: a hand-maintained merchant→rate map, surfaced on matching
# deals ("+ up to X% cashback") in email digests and on the /deals board. A deal
# matches when its merchant host equals a key or is a subdomain of it. Rates are
# headline "up to" values; refresh candidates with scripts/refresh_cashback.py
# (reads ShopBack's public store list) then paste reviewed values here. Set a
# rate to the base guaranteed % if you prefer to under-promise.
# ---------------------------------------------------------------------------
cashback:
  enabled: true
  provider_label: "ShopBack"
  rates:
    amazon.com.au: 5.0
    jbhifi.com.au: 10.0
    thegoodguys.com.au: 5.0
    dyson.com.au: 7.0
    samsung.com: 4.0
    myer.com.au: 2.7
    davidjones.com: 10.0
    theiconic.com.au: 5.5
    uniqlo.com: 7.0
    adidas.com.au: 4.0
    target.com.au: 1.75
    bonds.com.au: 7.0
    petbarn.com.au: 13.0
    bws.com.au: 3.5
    woolworths.com.au: 15.0
    coles.com.au: 0.15
    booking.com: 5.5
    agoda.com: 13.0
    expedia.com.au: 13.0
    temu.com: 12.5
    shein.com.au: 7.2

# ---------------------------------------------------------------------------
# Price-rank signal: ranks a deal's current price against its own recent
# high-confidence price history (read back from data/observations/*.jsonl — no
# new storage) so a "hot" deal is qualified by whether it's genuinely cheap.
# Slow-burn: the signal only appears once a deal has >= min_history_points prior
# sightings, so it strengthens as history accrues.
# ---------------------------------------------------------------------------
price_history:
  enabled: true
  lookback_days: 30
  min_history_points: 3
  near_fraction: 0.05

# ---------------------------------------------------------------------------
# Category taxonomy: maps each subscriber interest bucket (the ids the portal
# stores in Notion) to match terms. A deal belongs to a bucket when any term
# matches (word-boundary, case-insensitive) the deal's own categories, falling
# back to title/description when the deal carries no categories (e.g. CCC).
# Used to route lower hot tiers to subscribers by interest.
# ---------------------------------------------------------------------------
categories:
  electronics: ["Electrical & Electronics", "Computing", "Computer", "Laptop",
                "Monitor", "Mobile", "Phone", "Headphone", "Earbuds", "Camera",
                "Console", "PC", "GPU", "CPU", "SSD", "TV", "Tablet", "Router",
                "Smart Home", "Audio", "Speaker", "Charger"]
  home:        ["Home & Garden", "Home", "Kitchen", "Vacuum", "Microwave",
                "Furniture", "Appliance", "Bedding", "Mattress", "Cookware",
                "Cleaning", "Garden", "Tools", "Dyson"]
  fashion:     ["Fashion", "Apparel", "Clothing", "Shoe", "Sneaker", "T-Shirt",
                "Hoodie", "Jacket", "Watch", "Bag", "Sunglasses"]
  sports:      ["Sport", "Outdoor", "Fitness", "Bike", "Bicycle", "Camping",
                "Gym", "Running", "Hiking", "Golf"]
  toys:        ["Toy", "Toys", "Lego", "Board Game", "Gaming", "Video Game",
                "Nintendo", "PlayStation", "Xbox", "Switch"]
  beauty:      ["Health & Beauty", "Beauty", "Skincare", "Cosmetic", "Makeup",
                "Fragrance", "Perfume", "Haircare", "Supplement", "Vitamin"]
  food:        ["Groceries", "Grocery", "Food", "Wine", "Alcohol", "Beer",
                "Spirits", "Coffee", "Snack", "Chocolate", "Restaurant"]
  travel:      ["Travel", "Flight", "Flights", "Hotel", "Accommodation",
                "Theme Park", "Cruise", "Holiday", "Airline"]
  digital:     ["Software", "Internet", "Subscription", "Streaming", "Cloud",
                "VPN", "Antivirus", "Domain", "Web Hosting", "Mobile Plan",
                "Steam", "PC Game", "eBook", "Online Course", "AI", "SaaS",
                "Credit", "API"]

# ---------------------------------------------------------------------------
# Strategy guide collection (strategy_hunter). GitHub Actions harvests daily
# and runs `strategy-hunter extract` (Gemini) to distil the digest into guide
# JSON, opened as a PR for human review — falls back to manual extraction
# (feed digest/<date>.md + prompts/extract_guide.md to any LLM) if
# GEMINI_API_KEY isn't configured.
# ---------------------------------------------------------------------------
strategy:
  enabled: true
  min_relevance: 1                 # minimum money-saving signal words in title+body to keep a post
  request_delay_seconds: 1.0       # polite crawl delay when fetching thread bodies
  retention_days: 60               # raw corpus retention in days; pruned on each run (0 = keep forever)
  alert_on_failure: true           # email maintainer if a collection run errors or harvests nothing
  staleness_days: 30               # guides older than this (generated_at) are flagged for review
  extract:
    model: "gemini-2.5-flash"      # Gemini model for automated Stage 2 guide extraction (free tier)
    max_tokens: 65536              # output budget; gemini-2.5 thinking draws from this too; lower caps truncate JSON
    thinking_budget: 0             # 0 = disable thinking so the full budget goes to guide JSON
  onboarding:
    enabled: true
    programs_dir: "data/strategies/onboarding/programs"
    digest_dir: "data/strategies/onboarding/digest"
    raw_dir: "data/strategies/onboarding/raw"
    min_relevance: 1
    request_delay_seconds: 2.0
    retention_days: 90
    sources:
      ozbargain_tags:
        enabled: true
        tags: ["referral", "cashback", "giftcard", "bonus"]
      reddit:
        enabled: true
        subreddits: ["AusFinance", "AusFrugal"]
        listing: "hot"
        limit: 25
        request_delay_seconds: 8
        max_retries: 5
        max_backoff_seconds: 120
  sources:
    rss:
      enabled: true
      request_delay_seconds: 2.0
      feeds:
        - {url: "https://www.pointhacks.com.au/feed/",              board: "PointHacks"}
        - {url: "https://www.australianfrequentflyer.com.au/feed/", board: "AusFrequentFlyer"}
    reddit:
      enabled: true
      subreddits: ["AusFinance", "AusFrugal", "fiaustralia", "churning", "LocalLLaMA"]
      listing: "hot"              # hot | new | top
      limit: 25
      request_delay_seconds: 8     # gentle gap between subs (nightly run, not urgent)
      max_retries: 5               # patient retries on 429
      max_backoff_seconds: 120     # allow long Retry-After waits before skipping
    ozbargain_forum:
      enabled: true
      board_urls:
        - "https://www.ozbargain.com.au/forum/1341"   # Find Me A Bargain
        - "https://www.ozbargain.com.au/forum/38183"  # Financial
      max_threads_per_board: 25
      fetch_body: true
    ozbargain_comments:
      enabled: true
      feed_url: "https://www.ozbargain.com.au/deals/feed"
      min_comments: 10             # only dig into deals with >= this many comments (discussion-rich)
      max_deals: 15                # max deal node pages to scrape per run
    whirlpool:
      enabled: true
      board_urls:
        - "https://forums.whirlpool.net.au/forum/153" # Shopping
        - "https://forums.whirlpool.net.au/forum/150" # Finance
        - "https://forums.whirlpool.net.au/forum/149" # Travel
      max_threads_per_board: 25
      fetch_body: true

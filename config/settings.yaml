# Bargain Hunter — tunable parameters. Edit and push; no code change needed.

run:
  dry_run: false
  max_alerts_per_user_per_day: 10
  max_digital_alerts_per_day: 10    # default digital-track daily cap (Notion has no matching property)
  timezone: "Australia/Sydney"      # AET/AEDT — used for daily caps, quiet hours, and midnight boundary
  quiet_hours_start: "22:00"        # AEST — no alerts after 10pm
  quiet_hours_end: "07:00"          # AEST — no alerts before 7am (overnight window)
  quiet_hours_queue_max_age_hours: 12  # overnight-queued notifications older than this are dropped at drain

sources:
  ozbargain:
    enabled: true
    feed_url: "https://www.ozbargain.com.au/deals/feed"
  camelcamelcamel:
    enabled: true
    feed_url: "https://au.camelcamelcamel.com/top_drops/feed"

  # --- Global digital deals. All voteless (see scoring.hot.voteless_sources)
  # and reach subscribers via watch keywords (scoring.watch.trusted_sources).
  dealnews:
    enabled: true
    poll_interval_minutes: 60
    currency: "USD"
    feed_urls:
      - "https://www.dealnews.com/c124/Computers/Software/?rss=1"
    region_allow_patterns: ["global", "worldwide", "any region",
                            "international card", "全球可用", "支持国际信用卡"]
    region_block_patterns:
      - "US only"
      - "USA only"
      - "U\\.S\\. residents"
      - "US/CA residents"
      - "United States and Canada only"
      - "requires US billing"
      - "US billing (address|zip)"
      - "not available outside the US"
      - "US App Store"
      - "\\.edu email"
      - "(T-Mobile|Verizon|AT&T|Xfinity|Spectrum) customers"
      - "US (PayPal|Venmo)"
      - "region-locked"
      - "EU key"
      - "ROW excluded"
  slickdeals:
    enabled: true
    poll_interval_minutes: 60
    currency: "USD"
    # The query string IS the filter. Keep terms specific; bare "grok" collides
    # with "Grokking Simplicity" and "Grokit VR".
    feed_urls:
      - "https://slickdeals.net/newsearch.php?rss=1&q=supergrok&searcharea=deals&searchin=first"
      - "https://slickdeals.net/newsearch.php?rss=1&q=chatgpt&searcharea=deals&searchin=first"
      - "https://slickdeals.net/newsearch.php?rss=1&q=claude+ai&searcharea=deals&searchin=first"
      - "https://slickdeals.net/newsearch.php?rss=1&q=perplexity&searcharea=deals&searchin=first"
      - "https://slickdeals.net/newsearch.php?rss=1&q=vpn&searcharea=deals&searchin=first"
      - "https://slickdeals.net/newsearch.php?rss=1&q=cloud+storage&searcharea=deals&searchin=first"
    region_allow_patterns: ["global", "worldwide", "any region",
                            "international card", "全球可用", "支持国际信用卡"]
    region_block_patterns:
      - "US only"
      - "USA only"
      - "U\\.S\\. residents"
      - "US/CA residents"
      - "United States and Canada only"
      - "requires US billing"
      - "US billing (address|zip)"
      - "not available outside the US"
      - "US App Store"
      - "\\.edu email"
      - "(T-Mobile|Verizon|AT&T|Xfinity|Spectrum) customers"
      - "US (PayPal|Venmo)"
      - "region-locked"
      - "EU key"
      - "ROW excluded"
  v2ex:
    enabled: true
    poll_interval_minutes: 180
    currency: "CNY"
    feed_urls:
      - "https://www.v2ex.com/feed/deals.xml"
    region_allow_patterns: ["global", "worldwide", "any region",
                            "international card", "全球可用", "支持国际信用卡"]
    region_block_patterns:
      - "仅限中国大陆"
      - "仅限大陆用户"
      - "大陆不发"
      - "中国大陆手机号"
      - "\\+86"
      - "实名认证"
      - "仅支持支付宝"
      - "仅支持微信"
      - "不支持境外"
      - "海外用户不可用"
  openrouter:
    enabled: true
    poll_interval_minutes: 1440
    min_drop_percent: 10.0
    model_allowlist: []          # e.g. ["x-ai/", "anthropic/", "deepseek/"]

  # --- AU finance: CDR product reference data ---
  bank_rates:
    enabled: true
    poll_interval_minutes: 1440        # daily; rates do not move hourly
    currency: "AUD"
    min_rate_rise_bps: 10              # alert when a deposit rate rises >= 10bp
    min_bonus_points_rise: 10000       # alert when card signup points rise
    brands:                            # publicBaseUri verified 2026-08-20
      - {name: "ING",       base: "https://id.ob.ing.com.au",              x_v: 4}
      - {name: "UBank",     base: "https://public.cdr-api.86400.com.au",   x_v: 4}
      - {name: "Macquarie", base: "https://api.macquariebank.io",          x_v: 4}
      - {name: "Up",        base: "https://api.up.com.au",                 x_v: 4}
      - {name: "CommBank",  base: "https://api.commbank.com.au/public",    x_v: 4}
      - {name: "Westpac",   base: "https://digital-api.westpac.com.au",    x_v: 4}
      - {name: "NAB",       base: "https://openbank.api.nab.com.au",       x_v: 4}
      - {name: "ANZ",       base: "https://api.anz",                       x_v: 4}
      - {name: "Bendigo",   base: "https://api.cdr.bendigobank.com.au",    x_v: 4}
      - {name: "BOQ",       base: "https://api.cds.boq.com.au",            x_v: 5}
    product_categories:
      - "TRANS_AND_SAVINGS_ACCOUNTS"
      - "TERM_DEPOSITS"
      - "CRED_AND_CHRG_CARDS"

  # --- Travel: AU-departure airfare deals ---
  iknowthepilot:
    enabled: true
    poll_interval_minutes: 120
    currency: "AUD"
    feed_urls: ["https://www.iknowthepilot.com.au/feed/"]

scoring:
  window_minutes: 15               # 15-min window: accurate current momentum, 2-run detection
  hot:
    # V1 gate: 5 votes in 15 min = 20 votes/h — same velocity bar, shorter window
    min_votes_gain_per_window: 5   # net votes gained in window (V1)
    early_burst_age_hours: 2       # age threshold for early-burst detection (H)
    # V2=30: p90 of votes_pos in observed data is 44; 30 targets top ~25%
    early_burst_min_votes: 30      # early-burst absolute vote count (V2)
    velocity_top_percent: 10       # top P% of active deals enter candidate pool
    # threshold=1.5: calibrated on 143 observed deals → ~7% fire rate (10/143)
    hot_threshold: 1.5             # weighted heat score threshold
    neg_vote_penalty_weight: 0.5   # negative-vote penalty weight
    age_penalty_half_life_hours: 12  # age decay half-life
    min_votes_for_percentile: 10   # deals below this vote count skip the percentile gate
    # Data finding: deals with <10 votes but high comment velocity scored 12.4 (false positives).
    # Floor gates out these noise cases before scoring.
    min_votes_to_candidate: 10     # minimum votes to enter hot candidate pool (data-calibrated)
    # Data finding: comment velocity at 0.25 weight dominated scores (e.g. 10+ pts from comments alone).
    # 0.1 still rewards comment engagement without letting it override vote signal.
    comment_velocity_weight: 0.1   # comment velocity weight in scoring formula (reduced to reduce noise)
    # Quality gate (data-backed, 2026-06-24/25 observations):
    # Deals with votes < quality_high_votes_threshold MUST have discount >= quality_min_discount_pct.
    # Eliminates promo/food/membership deals (22-38 votes, no extractable discount)
    # while keeping genuine product discounts (e.g. 13 votes, 50% off).
    quality_min_discount_pct: 20.0  # deals below threshold need ≥20% discount
    quality_high_votes_threshold: 40  # deals with ≥40 votes skip the discount requirement
    # Sources with no vote signal at all — kept out of the OzBargain-calibrated
    # site velocity index (see the `watch.trusted_sources` counterpart below).
    voteless_sources: ["camelcamelcamel", "dealnews", "slickdeals", "v2ex",
                        "openrouter", "bank_rates", "iknowthepilot"]
    # Hot ladder (calibrated on ObservationLog: among distinct hot deals ~57%
    # reach 4.0 and ~36% reach 7.0). A deal earns the highest tier it qualifies
    # for; below `good` (= the old hot_threshold) it is not hot. `top` adds a
    # value gate (min_votes) so it captures genuinely strong deals, not just velocity.
    universal_top: true              # top tier reaches every hot subscriber, bypassing category filter
    tiers:
      - {name: top,   min_score: 7.0, min_votes: 40}
      - {name: great, min_score: 4.0}
      - {name: good,  min_score: 1.5}   # = the original hot floor
    # Event-day adaptive baseline: normalizes the absolute vote-velocity gates
    # above against a rolling per-hour site heat index so genuinely good deals
    # on high-traffic days (Boxing Day, Prime Day) aren't misclassified. The
    # warmup period means behaviour is unchanged for the first few days while
    # the baseline accumulates real data.
    adaptive:
      enabled: true
      ewma_half_life_days: 14
      index_percentile: 75
      min_deals_for_index: 5
      warmup_days: 3
      ratio_clamp_min: 0.5
      ratio_clamp_max: 3.0
      baseline_sample_clamp: 3.0
      min_baseline_velocity: 0.1
  watch:
    min_votes: 15                  # minimum positive votes after keyword match (raised to 15)
    min_discount_percent: 15       # discount threshold when no votes available (e.g. CCC) — raised to 15%
    max_deal_age_hours: 36         # skip deals older than 36h to avoid backlog filling daily cap
    # Editorially curated / keyword-scoped feeds carry neither votes nor a
    # parseable discount; the keyword match is itself the quality guard.
    trusted_sources: ["dealnews", "slickdeals", "v2ex", "openrouter",
                       "bank_rates", "iknowthepilot"]

dedup:
  lookback_days: 7                 # read recent Sent Log window for local dedup
  max_realerts_per_deal: 1         # allow one re-alert per (deal, subscriber): newly-satisfied watch ceiling or a significant price drop
  significant_price_drop_percent: 5.0
  heat_band_size_votes: 50

cold_start:
  ignore_deals_older_than_hours: 6  # on first sight, skip deals older than this

alerting:
  min_consecutive_failures: 3      # send maintainer alert only after this many consecutive failures
  cooldown_hours: 1.0              # silence period after an alert fires

# ---------------------------------------------------------------------------
# Cashback stacking: a hand-maintained merchant→rate map, surfaced on matching
# deals ("+ up to X% cashback") in email digests and on the /deals board. A deal
# matches when its merchant host equals a key or is a subdomain of it. Rates are
# headline "up to" values; refresh candidates with scripts/refresh_cashback.py
# (reads ShopBack's public store list) then paste reviewed values here. Set a
# rate to the base guaranteed % if you prefer to under-promise.
# ---------------------------------------------------------------------------
cashback:
  enabled: true
  provider_label: "ShopBack"
  rates:
    amazon.com.au: 5.0
    jbhifi.com.au: 10.0
    thegoodguys.com.au: 5.0
    dyson.com.au: 7.0
    samsung.com: 4.0
    myer.com.au: 2.7
    davidjones.com: 10.0
    theiconic.com.au: 5.5
    uniqlo.com: 7.0
    adidas.com.au: 4.0
    target.com.au: 1.75
    bonds.com.au: 7.0
    petbarn.com.au: 13.0
    bws.com.au: 3.5
    woolworths.com.au: 15.0
    coles.com.au: 0.15
    booking.com: 5.5
    agoda.com: 13.0
    expedia.com.au: 13.0
    temu.com: 12.5
    shein.com.au: 7.2

# ---------------------------------------------------------------------------
# Price-rank signal: ranks a deal's current price against its own recent
# high-confidence price history (read back from data/observations/*.jsonl — no
# new storage) so a "hot" deal is qualified by whether it's genuinely cheap.
# Slow-burn: the signal only appears once a deal has >= min_history_points prior
# sightings, so it strengthens as history accrues.
# ---------------------------------------------------------------------------
price_history:
  enabled: true
  lookback_days: 30
  min_history_points: 3
  near_fraction: 0.05

# ---------------------------------------------------------------------------
# Category taxonomy: maps each subscriber interest bucket (the ids the portal
# stores in Notion) to match terms. A deal belongs to a bucket when any term
# matches (word-boundary, case-insensitive) the deal's own categories, falling
# back to title/description when the deal carries no categories (e.g. CCC).
# Used to route lower hot tiers to subscribers by interest.
# ---------------------------------------------------------------------------
categories:
  electronics: ["Electrical & Electronics", "Computing", "Computer", "Laptop",
                "Monitor", "Mobile", "Phone", "Headphone", "Earbuds", "Camera",
                "Console", "PC", "GPU", "CPU", "SSD", "TV", "Tablet", "Router",
                "Smart Home", "Audio", "Speaker", "Charger"]
  home:        ["Home & Garden", "Home", "Kitchen", "Vacuum", "Microwave",
                "Furniture", "Appliance", "Bedding", "Mattress", "Cookware",
                "Cleaning", "Garden", "Tools", "Dyson"]
  fashion:     ["Fashion", "Apparel", "Clothing", "Shoe", "Sneaker", "T-Shirt",
                "Hoodie", "Jacket", "Watch", "Bag", "Sunglasses"]
  sports:      ["Sport", "Outdoor", "Fitness", "Bike", "Bicycle", "Camping",
                "Gym", "Running", "Hiking", "Golf"]
  toys:        ["Toy", "Toys", "Lego", "Board Game", "Gaming", "Video Game",
                "Nintendo", "PlayStation", "Xbox", "Switch"]
  beauty:      ["Health & Beauty", "Beauty", "Skincare", "Cosmetic", "Makeup",
                "Fragrance", "Perfume", "Haircare", "Supplement", "Vitamin"]
  food:        ["Groceries", "Grocery", "Food", "Wine", "Alcohol", "Beer",
                "Spirits", "Coffee", "Snack", "Chocolate", "Restaurant"]
  travel:      ["Travel", "Flight", "Flights", "Hotel", "Accommodation",
                "Theme Park", "Cruise", "Holiday", "Airline"]
  digital:     ["Software", "Internet", "Subscription", "Streaming", "Cloud",
                "VPN", "Antivirus", "Domain", "Web Hosting", "Mobile Plan",
                "Steam", "PC Game", "eBook", "Online Course", "AI", "SaaS",
                "Credit", "API"]

# ---------------------------------------------------------------------------
# Strategy guide collection (strategy_hunter). GitHub Actions harvests daily
# and runs `strategy-hunter extract` (Gemini) to distil the digest into guide
# JSON, opened as a PR for human review — falls back to manual extraction
# (feed digest/<date>.md + prompts/extract_guide.md to any LLM) if
# GEMINI_API_KEY isn't configured.
# ---------------------------------------------------------------------------
strategy:
  enabled: true
  min_relevance: 1                 # minimum money-saving signal words in title+body to keep a post
  request_delay_seconds: 1.0       # polite crawl delay when fetching thread bodies
  retention_days: 60               # raw corpus retention in days; pruned on each run (0 = keep forever)
  alert_on_failure: true           # email maintainer if a collection run errors or harvests nothing
  staleness_days: 30               # guides older than this (generated_at) are flagged for review
  extract:
    model: "gemini-2.5-flash"      # Gemini model for automated Stage 2 guide extraction (free tier)
    max_tokens: 65536              # output budget; gemini-2.5 thinking draws from this too; lower caps truncate JSON
    thinking_budget: 0             # 0 = disable thinking so the full budget goes to guide JSON
  onboarding:
    enabled: true
    programs_dir: "data/strategies/onboarding/programs"
    digest_dir: "data/strategies/onboarding/digest"
    raw_dir: "data/strategies/onboarding/raw"
    min_relevance: 1
    request_delay_seconds: 2.0
    retention_days: 90
    sources:
      ozbargain_tags:
        enabled: true
        tags: ["referral", "cashback", "giftcard", "bonus"]
      reddit:
        enabled: true
        subreddits: ["AusFinance", "AusFrugal"]
        listing: "hot"
        limit: 25
        request_delay_seconds: 8
        max_retries: 5
        max_backoff_seconds: 120
  sources:
    rss:
      enabled: true
      request_delay_seconds: 2.0
      feeds:
        - {url: "https://www.pointhacks.com.au/feed/",              board: "PointHacks"}
        - {url: "https://www.australianfrequentflyer.com.au/feed/", board: "AusFrequentFlyer"}
    reddit:
      enabled: true
      subreddits: ["AusFinance", "AusFrugal", "fiaustralia", "churning", "LocalLLaMA"]
      listing: "hot"              # hot | new | top
      limit: 25
      request_delay_seconds: 8     # gentle gap between subs (nightly run, not urgent)
      max_retries: 5               # patient retries on 429
      max_backoff_seconds: 120     # allow long Retry-After waits before skipping
    ozbargain_forum:
      enabled: true
      board_urls:
        - "https://www.ozbargain.com.au/forum/1341"   # Find Me A Bargain
        - "https://www.ozbargain.com.au/forum/38183"  # Financial
      max_threads_per_board: 25
      fetch_body: true
    ozbargain_comments:
      enabled: true
      feed_url: "https://www.ozbargain.com.au/deals/feed"
      min_comments: 10             # only dig into deals with >= this many comments (discussion-rich)
      max_deals: 15                # max deal node pages to scrape per run
    whirlpool:
      enabled: true
      board_urls:
        - "https://forums.whirlpool.net.au/forum/153" # Shopping
        - "https://forums.whirlpool.net.au/forum/150" # Finance
        - "https://forums.whirlpool.net.au/forum/149" # Travel
      max_threads_per_board: 25
      fetch_body: true
